<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRESCRIPTION</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#111}
.app{max-width:900px;margin:auto;padding:12px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:12px;font-weight:700}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid #aaa;border-radius:6px;padding:8px;background:#fff}
button{border:0;border-radius:6px;padding:9px 12px;background:#333;color:#fff}
button.secondary{background:#666}
button.danger{background:#9b2226}
button.small{padding:6px 8px;font-size:12px}
.field{display:flex;flex-direction:column;gap:4px}
.patient-grid{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.codebar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.codebar .field{flex:1;min-width:220px}
.section-title{font-weight:700;margin-bottom:8px}
.med-row{border:1px solid #ccc;border-radius:8px;padding:8px;margin-bottom:8px}
.med-grid{display:grid;grid-template-columns:90px 1fr 110px 80px 90px;gap:7px}
.med-grid .wide{grid-column:span 2}
.meds-head{display:grid;grid-template-columns:40px 1fr 90px;gap:8px;font-size:12px;font-weight:700;margin-bottom:5px}
.advice-line{display:flex;gap:8px;align-items:center;margin:4px 0}
.advice-line input{flex:1}
.library-list{max-height:260px;overflow:auto}
.lib-item{display:grid;grid-template-columns:55px 1fr auto;gap:6px;align-items:center;border-bottom:1px solid #eee;padding:6px 0}
.muted{font-size:12px;color:#666}
.hidden{display:none!important}
#printArea{display:none}
@media(max-width:650px){
 .patient-grid{grid-template-columns:1fr}
 .med-grid{grid-template-columns:80px 1fr 75px}
 .med-grid .wide{grid-column:1/-1}
}
@media print{
 @page{size:A5 portrait;margin:9mm}
 body{background:#fff}
 .app{display:none!important}
 #printArea{display:block!important;font-family:Arial,sans-serif;color:#111}
 .print-page{min-height:190mm;position:relative;padding-top:10mm}
 .print-patient{font-size:15px;font-weight:700;margin-bottom:8mm}
 .print-med{font-size:15px;margin-bottom:5mm}
 .print-main{display:grid;grid-template-columns:1fr 45mm;gap:4mm;align-items:baseline;font-weight:700}
 .print-qty{text-align:left}
 .print-inst{font-size:14px;margin-top:2mm;line-height:1.35}
 .print-rule{border-top:1px solid #777;margin-top:4mm}
 .print-advice{font-size:14px;line-height:1.35;margin-top:5mm}
 .print-advice-item{margin:1mm 0}
 .print-footer{position:absolute;left:0;right:0;bottom:2mm;display:flex;justify-content:space-between;align-items:end;font-size:13px}
 .follow{font-weight:700}
 .doctor{text-align:right;font-weight:700}
 .clinic{font-weight:400;margin-top:1mm}
}
</style>
</head>
<body>
<div class="app">
<h1>PRESCRIPTION</h1>

<div class="card">
<div class="section-title">PATIENT</div>
<div class="patient-grid">
<div class="field"><label>PATIENT ID</label><input id="patientId" autocomplete="off"></div>
<div class="field"><label>PATIENT NAME</label><input id="patientName" autocomplete="off"></div>
</div>
</div>

<div class="card">
<div class="section-title">MEDICINES</div>
<div class="codebar">
<div class="field">
<label>MEDICINE CODES (e.g. 1,33,81)</label>
<input id="medicineCodes" placeholder="1,33,81" autocomplete="off">
</div>
<button id="fillMedicineCodes">FILL MEDICINES</button>
<button class="secondary" id="medicineLibraryBtn">MEDICINE LIBRARY</button>
</div>
<div class="muted" style="margin-top:5px">Enter saved codes separated by commas. They will be added in exactly that sequence.</div>
<div id="medicineRows" style="margin-top:10px"></div>
<button class="secondary" id="addMedicine">+ ADD MEDICINE</button>
</div>

<div class="card">
<div class="section-title">ADVICE</div>
<div class="codebar">
<div class="field">
<label>ADVICE CODES (e.g. 1,3)</label>
<input id="adviceCodes" placeholder="1,3" autocomplete="off">
</div>
<button id="fillAdviceCodes">FILL ADVICE</button>
<button class="secondary" id="adviceLibraryBtn">ADVICE LIBRARY</button>
</div>
<div id="adviceRows" style="margin-top:8px"></div>
</div>

<div class="card">
<div class="row">
<button id="printBtn">PRINT / SAVE PDF</button>
<button class="secondary" id="saveBtn">SAVE</button>
<button class="danger" id="clearBtn">CLEAR</button>
</div>
<div class="muted" id="status" style="margin-top:7px"></div>
</div>

<div class="card hidden" id="medicineLibCard">
<div class="section-title">MEDICINE LIBRARY</div>
<div class="row">
<input id="mCode" placeholder="Code" style="width:75px">
<input id="mName" placeholder="Medicine name" style="flex:1">
<select id="mForm"><option>TABLET</option><option>CAPSULE</option><option>SYRUP</option><option>CREAM</option><option>OTHER</option></select>
<input id="mDose" placeholder="Dose" style="width:90px">
<input id="mQty" placeholder="Quantity" style="width:85px">
<input id="mDuration" placeholder="Duration days" style="width:110px">
</div>
<textarea id="mInstruction" placeholder="Instructions" rows="2" style="width:100%;margin-top:8px"></textarea>
<div class="row" style="margin-top:8px">
<button id="saveMedicine">SAVE MEDICINE</button>
<button class="secondary" id="closeMedicineLib">CLOSE</button>
</div>
<div id="medicineLibraryList" class="library-list" style="margin-top:8px"></div>
</div>

<div class="card hidden" id="adviceLibCard">
<div class="section-title">ADVICE LIBRARY</div>
<div class="row">
<input id="aCode" placeholder="Code" style="width:75px">
<input id="aText" placeholder="Advice text" style="flex:1">
</div>
<div class="row" style="margin-top:8px">
<button id="saveAdvice">SAVE ADVICE</button>
<button class="secondary" id="closeAdviceLib">CLOSE</button>
</div>
<div id="adviceLibraryList" class="library-list" style="margin-top:8px"></div>
</div>
</div>

<div id="printArea"></div>

<script>
const $=id=>document.getElementById(id);
let medicines=JSON.parse(localStorage.getItem('paras_medicines')||'[]');
let advices=JSON.parse(localStorage.getItem('paras_advices')||'[]');
let medCounter=0;

function saveLibraries(){
 localStorage.setItem('paras_medicines',JSON.stringify(medicines));
 localStorage.setItem('paras_advices',JSON.stringify(advices));
}
function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function makeMedRow(data={}){
 medCounter++;
 const d=document.createElement('div');
 d.className='med-row';
 d.dataset.row=medCounter;
 d.innerHTML=`
 <div class="med-grid">
   <div class="field"><label>CODE</label><input class="med-code" value="${esc(data.code||'')}" autocomplete="off"></div>
   <div class="field"><label>MEDICINE</label><input class="med-name" value="${esc(data.name||'')}"></div>
   <div class="field"><label>FORM</label><select class="med-form">
    ${['TABLET','CAPSULE','SYRUP','CREAM','OTHER'].map(x=>`<option ${x===(data.form||'TABLET')?'selected':''}>${x}</option>`).join('')}
   </select></div>
   <div class="field"><label>DOSE</label><input class="med-dose" value="${esc(data.dose||'')}"></div>
   <div class="field"><label>QTY</label><input class="med-qty" value="${esc(data.qty||'')}"></div>
   <div class="field wide"><label>INSTRUCTIONS</label><input class="med-inst" value="${esc(data.instruction||'')}"></div>
   <div class="field"><label>DURATION</label><input class="med-duration" value="${esc(data.duration||'')}"></div>
   <div><button class="danger small remove-med">REMOVE</button></div>
 </div>`;
 $('medicineRows').appendChild(d);
 d.querySelector('.med-code').addEventListener('change',()=>fillSingleMedicine(d));
 d.querySelector('.remove-med').onclick=()=>{d.remove();updateFollowup();};
 return d;
}
function findMed(code){return medicines.find(x=>String(x.code).toUpperCase()===String(code).trim().toUpperCase())}
function fillSingleMedicine(row){
 const m=findMed(row.querySelector('.med-code').value);
 if(!m)return;
 row.querySelector('.med-name').value=m.name||'';
 row.querySelector('.med-form').value=m.form||'TABLET';
 row.querySelector('.med-dose').value=m.dose||'';
 row.querySelector('.med-qty').value=m.qty||'';
 row.querySelector('.med-inst').value=m.instruction||'';
 row.querySelector('.med-duration').value=m.duration||'';
 updateFollowup();
}
function fillMedicineCodes(){
 const codes=$('medicineCodes').value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
 if(!codes.length)return;
 $('medicineRows').innerHTML='';
 codes.forEach(code=>fillSingleMedicine(makeMedRow({code})));
 updateFollowup();
}
function addAdviceRow(text=''){
 const d=document.createElement('div'); d.className='advice-line';
 d.innerHTML=`<input class="advice-text" value="${esc(text)}"><button class="danger small">X</button>`;
 d.querySelector('button').onclick=()=>d.remove();
 $('adviceRows').appendChild(d);
 return d;
}
function fillAdviceCodes(){
 const codes=$('adviceCodes').value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
 if(!codes.length)return;
 $('adviceRows').innerHTML='';
 codes.forEach(c=>{
   const a=advices.find(x=>String(x.code).toUpperCase()===c.toUpperCase());
   if(a)addAdviceRow(a.text);
 });
}
function getDuration(row){
 const n=parseInt(row.querySelector('.med-duration').value,10);
 if(Number.isFinite(n))return n;
 const s=row.querySelector('.med-inst').value||'';
 const m=s.match(/(?:FOR|X)\\s+(\\d+)\\s*DAYS?/i);
 return m?parseInt(m[1],10):0;
}
function updateFollowup(){}
function savePrescription(){
 localStorage.setItem('paras_current_prescription',JSON.stringify({
   patientId:$('patientId').value,patientName:$('patientName').value,
   medicineCodes:$('medicineCodes').value,
   medicines:[...document.querySelectorAll('.med-row')].map(r=>({
    code:r.querySelector('.med-code').value,name:r.querySelector('.med-name').value,
    form:r.querySelector('.med-form').value,dose:r.querySelector('.med-dose').value,
    qty:r.querySelector('.med-qty').value,instruction:r.querySelector('.med-inst').value,
    duration:r.querySelector('.med-duration').value
   })),
   advice:[...document.querySelectorAll('.advice-text')].map(x=>x.value)
 }));
 $('status').textContent='Changes saved';
 setTimeout(()=>{$('status').textContent=''},1800);
}
function loadPrescription(){
 const x=JSON.parse(localStorage.getItem('paras_current_prescription')||'null');
 if(!x)return;
 $('patientId').value=x.patientId||'';$('patientName').value=x.patientName||'';
 $('medicineCodes').value=x.medicineCodes||'';
 $('medicineRows').innerHTML='';
 (x.medicines||[]).forEach(m=>makeMedRow(m));
 $('adviceRows').innerHTML='';(x.advice||[]).forEach(a=>addAdviceRow(a));
}
function renderMedLibrary(){
 $('medicineLibraryList').innerHTML=medicines.length?medicines.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map((m,i)=>`
 <div class="lib-item"><b>${esc(m.code)}</b><span>${esc(m.name)} ${esc(m.dose||'')} <small>${esc(m.duration||'')}d</small></span>
 <span><button class="small secondary" onclick="editMed(${i})">EDIT</button> <button class="small danger" onclick="delMed(${i})">REMOVE</button></span></div>`).join(''):'<div class="muted">No medicines saved yet.</div>';
}
window.editMed=i=>{
 const m=medicines[i];$('mCode').value=m.code||'';$('mName').value=m.name||'';$('mForm').value=m.form||'TABLET';$('mDose').value=m.dose||'';$('mQty').value=m.qty||'';$('mDuration').value=m.duration||'';$('mInstruction').value=m.instruction||'';
 $('mCode').dataset.edit=i;
};
window.delMed=i=>{if(confirm('Remove this medicine?')){medicines.splice(i,1);saveLibraries();renderMedLibrary();}};
function renderAdviceLibrary(){
 $('adviceLibraryList').innerHTML=advices.length?advices.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})).map((a,i)=>`
 <div class="lib-item"><b>${esc(a.code)}</b><span>${esc(a.text)}</span>
 <span><button class="small secondary" onclick="editAdv(${i})">EDIT</button> <button class="small danger" onclick="delAdv(${i})">REMOVE</button></span></div>`).join(''):'<div class="muted">No advice saved yet.</div>';
}
window.editAdv=i=>{$('aCode').value=advices[i].code;$('aText').value=advices[i].text;$('aCode').dataset.edit=i};
window.delAdv=i=>{if(confirm('Remove this advice?')){advices.splice(i,1);saveLibraries();renderAdviceLibrary();}};
$('fillMedicineCodes').onclick=fillMedicineCodes;
$('medicineCodes').addEventListener('change',fillMedicineCodes);
$('addMedicine').onclick=()=>makeMedRow();
$('fillAdviceCodes').onclick=fillAdviceCodes;
$('adviceCodes').addEventListener('change',fillAdviceCodes);
$('medicineLibraryBtn').onclick=()=>{$('medicineLibCard').classList.remove('hidden');renderMedLibrary()};
$('closeMedicineLib').onclick=()=>$('medicineLibCard').classList.add('hidden');
$('adviceLibraryBtn').onclick=()=>{$('adviceLibCard').classList.remove('hidden');renderAdviceLibrary()};
$('closeAdviceLib').onclick=()=>$('adviceLibCard').classList.add('hidden');
$('saveMedicine').onclick=()=>{
 const obj={code:$('mCode').value.trim(),name:$('mName').value.trim(),form:$('mForm').value,dose:$('mDose').value.trim(),qty:$('mQty').value.trim(),duration:$('mDuration').value.trim(),instruction:$('mInstruction').value.trim()};
 if(!obj.code||!obj.name){alert('Enter at least Code and Medicine name');return}
 const i=$('mCode').dataset.edit;
 if(i!==undefined&&i!==''){medicines[Number(i)]=obj;delete $('mCode').dataset.edit}else medicines.push(obj);
 saveLibraries();['mCode','mName','mDose','mQty','mDuration','mInstruction'].forEach(id=>$(id).value='');renderMedLibrary();
};
$('saveAdvice').onclick=()=>{
 const obj={code:$('aCode').value.trim(),text:$('aText').value.trim()};
 if(!obj.code||!obj.text){alert('Enter Code and Advice');return}
 const i=$('aCode').dataset.edit;
 if(i!==undefined&&i!==''){advices[Number(i)]=obj;delete $('aCode').dataset.edit}else advices.push(obj);
 saveLibraries();$('aCode').value='';$('aText').value='';renderAdviceLibrary();
};
$('saveBtn').onclick=savePrescription;
$('clearBtn').onclick=()=>{if(confirm('Clear current prescription?')){localStorage.removeItem('paras_current_prescription');location.reload()}};
function updatePrintView(){
 const meds=[...document.querySelectorAll('.med-row')];
 const advice=[...document.querySelectorAll('.advice-text')].map(x=>x.value.trim()).filter(Boolean);
 let follow='';
 const ds=meds.map(getDuration).filter(x=>x>0);
 if(ds.length){
  const max=Math.max(...ds);
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+max+1);
  if(d.getDay()===0)d.setDate(d.getDate()+1);
  follow=`FOLLOW UP: ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
 }
 $('printArea').innerHTML=`<div class="print-page">
 <div class="print-patient">${esc($('patientId').value)}${$('patientId').value&&$('patientName').value?' — ':''}${esc($('patientName').value)}</div>
 ${meds.map((r,i)=>`<div class="print-med"><div class="print-main"><div>${i+1}. ${esc(r.querySelector('.med-form').value)} ${esc(r.querySelector('.med-name').value)} ${esc(r.querySelector('.med-dose').value)}</div><div class="print-qty">${esc(r.querySelector('.med-qty').value)}</div></div><div class="print-inst">${esc(r.querySelector('.med-inst').value)}</div><div class="print-rule"></div></div>`).join('')}
 ${advice.length?`<div class="print-advice"><b>ADVICE</b>${advice.map((a,i)=>`<div class="print-advice-item">${i+1}. ${esc(a)}</div>`).join('')}</div>`:''}
 <div class="print-footer"><div class="follow">${follow}</div><div class="doctor">Dr. Yatharth Dorle<div class="clinic">Paras Clinic, Hupari</div></div></div>
 </div>`;
}
$('printBtn').onclick=()=>{updatePrintView();setTimeout(()=>window.print(),50)};
loadPrescription();
if(!document.querySelector('.med-row'))makeMedRow();
</script>
</body>
</html>
