<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRESCRIPTION</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
.app{max-width:900px;margin:auto;background:#fff;min-height:100vh;padding:14px}

h1{text-align:center;font-size:22px;margin:4px 0 12px;letter-spacing:1px}

.header-space{
 height:2in;
 border:1px dashed #cbd5e1;
 margin-bottom:8px;
 display:flex;
 align-items:flex-end;
 justify-content:flex-end;
 padding:6px;
 color:#94a3b8;
 font-size:11px
}

.date{text-align:right;font-size:12px;margin-bottom:12px}

.grid{
 display:grid;
 grid-template-columns:1fr 2fr;
 gap:8px;
 margin-bottom:14px
}

.field{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;font-weight:bold}

input,textarea,select,button{font:inherit}
input,textarea,select{
 border:1px solid #cbd5e1;
 border-radius:7px;
 padding:9px;
 background:#fff
}

textarea{min-height:70px;resize:vertical}

.section{
 border-top:2px solid #0f766e;
 margin-top:14px;
 padding-top:8px
}

.section-title{font-weight:bold;font-size:14px;margin-bottom:8px}

.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}

button{
 border:0;
 border-radius:7px;
 padding:9px 12px;
 background:#0f766e;
 color:#fff;
 font-weight:bold
}

button.secondary{background:#475569}
button.danger{background:#b91c1c}
button.light{background:#e2e8f0;color:#111827}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{
 border:1px solid #cbd5e1;
 padding:5px;
 vertical-align:top
}
th{background:#f1f5f9}
table input,table select{width:100%;padding:6px;border:0}

.status{
 text-align:center;
 font-size:12px;
 color:#15803d;
 min-height:18px;
 margin:6px
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal-box{
 background:#fff;
 border-radius:12px;
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 padding:15px
}

.librow{
 display:grid;
 grid-template-columns:70px 1fr 100px 70px;
 gap:5px;
 margin-bottom:5px;
 align-items:center
}

.print-only{display:none}

@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .librow{grid-template-columns:60px 1fr 75px 55px}
}

@media print{

 body{background:#fff}
 .app{padding:0;max-width:none}
 .no-print{display:none!important}

 .header-space{
  height:2in;
  border:0
 }

 .print-only{display:block!important}

 .print-patient{
  font-size:14px;
  margin-bottom:18px
 }

 .print-patient div{margin:3px 0}

 .print-meds{font-size:13px}

 .print-med{
  padding:9px 0;
  border-bottom:1px solid #9ca3af;
  page-break-inside:avoid
 }

 .print-main{
  display:flex;
  align-items:baseline;
  gap:7px;
  font-weight:bold
 }

 .print-no{
  width:25px;
  flex:0 0 25px
 }

 .print-name{
  flex:1;
  text-transform:uppercase
 }

 .print-qty{
  min-width:55px;
  text-align:right
 }

 .print-instr{
  padding:5px 55px 0 32px;
  line-height:1.4
 }

 .print-advice{
  margin-top:15px;
  font-size:13px
 }

 .print-advice-title{
  font-weight:bold;
  font-size:15px;
  margin-bottom:6px
 }

 .print-advice-line{
